<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Fight - Financial Report Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            color: #333;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fake Fight: Verify Financial Reports</h2>
        <input type="text" id="urlInput" placeholder="Enter financial report URL...">
        <button onclick="checkURL()">Check</button>
        <p class="result" id="resultText"></p>
    </div>

    <script>
        function checkURL() {
            const url = document.getElementById("urlInput").value;
            if (!url) {
                alert("Please enter a URL");
                return;
            }

            fetch("http://127.0.0.1:5000/verify", {  // Adjust backend URL if needed
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ url: url })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("resultText").textContent = 
                    data.result ? "This report is REAL ✅" : "This report is FAKE ❌";
                document.getElementById("resultText").style.color = 
                    data.result ? "green" : "red";
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("resultText").textContent = "Error processing request.";
            });
        }
    </script>
</body>
</html>
